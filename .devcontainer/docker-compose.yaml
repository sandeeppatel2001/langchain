version: '3'
services:
  langchain:
    build:
      dockerfile: libs/langchain/dev.Dockerfile
      context: ..
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    networks:
      - langchain-network

networks:
  langchain-network:
    driver: bridge
